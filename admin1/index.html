
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velan View Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app-shell">
  <section id="loginView" class="card auth-card">
    <div class="brand">VELAN VIEW</div>
    <h1>Admin Login</h1>
    <p class="muted">Manage room rates and availability.</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
      <p id="loginMessage" class="message"></p>
    </form>
  </section>

  <section id="dashboardView" class="dashboard hidden">
    <header class="topbar">
      <div><div class="brand">VELAN VIEW</div><h1>Room Management</h1></div>
      <div class="top-actions"><a href="../index.html" target="_blank">View Website</a><button id="logoutBtn" class="secondary">Logout</button></div>
    </header>

    <div class="stats">
      <div class="stat"><span>Room Types</span><strong id="roomCount">0</strong></div>
      <div class="stat"><span>Available Rooms</span><strong id="availableCount">0</strong></div>
    </div>

    <div class="section-head"><div><h2>Rooms</h2><p class="muted">Change price or availability and press Save.</p></div><button id="refreshBtn" class="secondary">Refresh</button></div>
    <div id="roomsContainer" class="rooms"></div>
    <p id="dashboardMessage" class="message"></p>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
